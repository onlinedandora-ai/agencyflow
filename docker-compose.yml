services:
  postgres:
    image: postgres:16-alpine
    container_name: agencyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencyflow
      POSTGRES_PASSWORD: agencyflow
      POSTGRES_DB: agencyflow
    ports:
      - "5433:5432"
    volumes:
      - agencyflow_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agencyflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  agencyflow_pg:
